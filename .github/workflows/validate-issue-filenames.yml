name: Validate Issue Filenames

on:
  push:
    paths:
      - 'issues/*.md'
      - 'scripts/dev/validate_issue_filenames.py'
      - '.github/workflows/validate-issue-filenames.yml'
  pull_request:
    paths:
      - 'issues/*.md'
      - 'scripts/dev/validate_issue_filenames.py'
      - '.github/workflows/validate-issue-filenames.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate issue filenames
        run: python scripts/dev/validate_issue_filenames.py
