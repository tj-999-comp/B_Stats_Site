name: Validate Work Record Filenames

on:
  push:
    paths:
      - 'work-records/**'
      - 'scripts/dev/validate_work_record_filenames.py'
      - 'scripts/dev/sync_github_issue_status.py'
      - 'scripts/dev/github_issue_status_policy.json'
      - '.github/workflows/validate-work-record-filenames.yml'
  pull_request:
    paths:
      - 'work-records/**'
      - 'scripts/dev/validate_work_record_filenames.py'
      - 'scripts/dev/sync_github_issue_status.py'
      - 'scripts/dev/github_issue_status_policy.json'
      - '.github/workflows/validate-work-record-filenames.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate current GitHub Issue status
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/dev/sync_github_issue_status.py --repo "${{ github.repository }}" --check

      - name: Validate work record filenames and placement
        run: python scripts/dev/validate_work_record_filenames.py
